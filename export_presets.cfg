html/head_include="<meta name=\"theme-color\" content=\"#050810\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"No Hitter\">\n<script>\n(function () {\n\t'use strict';\n\tconst state = { installPrompt: null, installed: false, wakeLock: null };\n\tasync function keepAwake() {\n\t\tif (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return false;\n\t\tif (state.wakeLock && !state.wakeLock.released) return true;\n\t\ttry {\n\t\t\tstate.wakeLock = await navigator.wakeLock.request('screen');\n\t\t\tstate.wakeLock.addEventListener('release', function () { state.wakeLock = null; }, { once: true });\n\t\t\treturn true;\n\t\t} catch (error) {\n\t\t\treturn false;\n\t\t}\n\t}\n\twindow.OFPS_PWA = {\n\t\tinstallAvailable: function () { return Boolean(state.installPrompt); },\n\t\tpromptInstall: function () {\n\t\t\tconst event = state.installPrompt;\n\t\t\tif (!event) return false;\n\t\t\tstate.installPrompt = null;\n\t\t\tevent.prompt();\n\t\t\tevent.userChoice.catch(function () {});\n\t\t\treturn true;\n\t\t},\n\t\tisInstalled: function () { return state.installed; },\n\t\tkeepAwake: keepAwake\n\t};\n\twindow.addEventListener('beforeinstallprompt', function (event) { event.preventDefault(); state.installPrompt = event; });\n\twindow.addEventListener('appinstalled', function () { state.installPrompt = null; state.installed = true; });\n\twindow.addEventListener('load', keepAwake, { once: true });\n\twindow.addEventListener('pageshow', keepAwake);\n\twindow.addEventListener('pointerdown', keepAwake, { passive: true });\n\twindow.addEventListener('keydown', keepAwake);\n\tdocument.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });\n})();\n</script>"
